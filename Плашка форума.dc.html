<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ show }}" hint-placeholder-val="{{ true }}">
  <aside aria-label="Опрос гостей форума" style="{{ wrapStyle }}">
    <a href="Опрос форума.dc.html" style="{{ cardStyle }}">
      <span style="{{ kickStyle }}">Опрос гостей форума</span>
      <span style="{{ titleStyle }}">Что изменил для вас форум?</span>
      <span style="{{ noteStyle }}">16 вопросов · около 5 минут</span>
      <span style="{{ btnStyle }}" style-hover="background: #E8C9A0">Пройти опрос →</span>
    </a>
    <button type="button" aria-label="Закрыть" onClick="{{ close }}" style="{{ closeStyle }}">×</button>
  </aside>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:200}}">// Плавающая карточка: приглашение пройти опрос гостей форума («Опрос форума.dc.html»).
// Показывается через несколько секунд, закрывается крестиком и больше не появляется (запоминается в браузере).
// Не показывается и тем, кто уже прошёл опрос (SURVEY_DONE_KEY ставит страница опроса).
const CLOSED_KEY = 'mn-survey-promo-closed';
const SURVEY_DONE_KEY = 'mn-survey-done';
const COOKIE_KEY = 'mn-cookie-consent';
const SHOW_AFTER_MS = 5000;

class Component extends DCLogic {
  state = { show: false, entered: false, mobile: false, lift: false };

  componentDidMount() {
    try { if (localStorage.getItem(CLOSED_KEY) || localStorage.getItem(SURVEY_DONE_KEY)) return; } catch (e) {}
    if (!document.querySelector('link[data-mn-promo-fonts]')) {
      const l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Oswald:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap';
      l.setAttribute('data-mn-promo-fonts', '');
      document.head.appendChild(l);
    }
    this.mq = window.matchMedia('(max-width: 640px)');
    this.sync = () => this.setState({ mobile: this.mq.matches });
    this.mq.addEventListener ? this.mq.addEventListener('change', this.sync) : this.mq.addListener(this.sync);
    this.sync();
    // пока не отвечено на cookie-баннер — поднимаем карточку выше него
    this.poll = setInterval(() => {
      let saved = null;
      try { saved = localStorage.getItem(COOKIE_KEY); } catch (e) {}
      const lift = !saved;
      if (lift !== this.state.lift) this.setState({ lift });
    }, 600);
    this.timer = setTimeout(() => {
      this.setState({ show: true });
      this.timer2 = setTimeout(() => this.setState({ entered: true }), 40);
    }, SHOW_AFTER_MS);
  }

  componentWillUnmount() {
    clearTimeout(this.timer); clearTimeout(this.timer2); clearInterval(this.poll);
    if (this.mq) { this.mq.removeEventListener ? this.mq.removeEventListener('change', this.sync) : this.mq.removeListener(this.sync); }
  }

  close() {
    try { localStorage.setItem(CLOSED_KEY, '1'); } catch (e) {}
    this.setState({ entered: false });
    setTimeout(() => this.setState({ show: false }), 250);
  }

  renderVals() {
    const { entered, mobile, lift } = this.state;
    // на телефоне cookie-баннер высокий — ждём ответа на него, прежде чем показывать карточку
    const show = this.state.show && !(lift && mobile);
    const bottom = lift ? (mobile ? 190 : 150) : (mobile ? 12 : 24);
    const font = "'IBM Plex Sans', system-ui, sans-serif";
    const osw = "'Oswald', 'IBM Plex Sans', sans-serif";
    const pf = "'Playfair Display', Georgia, serif";
    return {
      show,
      close: () => this.close(),
      wrapStyle: `position: fixed; z-index: 55; right: ${mobile ? 12 : 24}px; ${mobile ? 'left: 12px; ' : ''}bottom: ${bottom}px; ${mobile ? '' : 'width: 340px; '}font-family: ${font}; transition: opacity 0.3s ease, transform 0.3s ease, bottom 0.25s ease; opacity: ${entered ? 1 : 0}; transform: translateY(${entered ? 0 : 18}px); filter: drop-shadow(0 16px 34px rgba(36,16,18,0.42))`,
      cardStyle: `position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: ${mobile ? 8 : 18}px; padding: ${mobile ? '16px 48px 14px 16px' : '30px 26px 26px'}; background: #5B0207; color: #FFFBF7; text-decoration: none`,
      kickStyle: `font: 500 ${mobile ? 11 : 12}px/1.2 ${osw}; letter-spacing: 0.18em; text-transform: uppercase; color: #E8C9A0`,
      titleStyle: `display: block; font: 900 ${mobile ? 19 : 30}px/1.08 ${pf}; letter-spacing: -0.01em; color: #FFFBF7; ${mobile ? '' : 'padding-right: 18px'}`,
      noteStyle: mobile ? 'display: none' : `display: inline-block; margin-left: -12px; padding: 7px 34px 9px 24px; background: url(uploads/forum-mazok-1.png) center / 100% 100% no-repeat; font: 700 17px/1 ${osw}; letter-spacing: 0.04em; text-transform: uppercase; color: #5B0207; white-space: nowrap`,
      btnStyle: mobile
        ? `font: 500 12px/1.2 ${osw}; letter-spacing: 0.12em; text-transform: uppercase; color: #D8F32A`
        : `display: flex; align-self: stretch; align-items: center; justify-content: center; margin-top: 8px; padding: 16px 20px; background: #FFFBF7; color: #5B0207; font: 500 14px/1 ${osw}; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; transition: background 0.2s`,
      closeStyle: `position: absolute; top: ${mobile ? 12 : 12}px; right: ${mobile ? 8 : 10}px; width: 30px; height: 30px; padding: 0; background: rgba(255,251,247,0.14); border: none; border-radius: 50%; color: #FFFBF7; font: 400 20px/1 ${font}; cursor: pointer; display: flex; align-items: center; justify-content: center`
    };
  }
}</script>
</body>
</html>
