<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header ref="{{ headerRef }}" style="background: #F3E7D8; border-bottom: 1px solid rgba(117,7,13,0.25); position: relative; transition: transform 0.28s ease; will-change: transform" onMouseLeave="{{ close }}">
  <div style="max-width: 1280px; margin: 0 auto; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; position: relative; z-index: 3; background: #F3E7D8">
    <a href="Модный Нижний.dc.html" style="display: flex; align-items: center">
      <img src="uploads/logo_long.svg.svg" alt="Модный Нижний" style="height: 30px; width: auto; display: block">
    </a>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ toggleMobile }}" aria-label="Меню" style="display: flex; flex-direction: column; justify-content: center; gap: 5px; width: 44px; height: 44px; padding: 0 10px; background: transparent; border: 1px solid rgba(117,7,13,0.35); cursor: pointer">
        <span style="display: block; height: 1.5px; background: #75070D"></span>
        <span style="display: block; height: 1.5px; background: #75070D"></span>
        <span style="display: block; height: 1.5px; background: #75070D"></span>
      </button>
    </sc-if>
    <nav style="{{ navStyle }}">
      <sc-for list="{{ items }}" as="item" hint-placeholder-count="5">
        <a href="{{ item.href }}" onMouseEnter="{{ item.onEnter }}" onClick="{{ item.onClick }}" style="{{ item.style }}">{{ item.label }}</a>
        <sc-if value="{{ item.mobileOpen }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 10px; padding: 2px 0 6px 14px; border-left: 1px solid rgba(117,7,13,0.25)">
            <sc-for list="{{ item.allLinks }}" as="link" hint-placeholder-count="3">
              <a href="{{ link.href }}" onClick="{{ closeMobile }}" style="font-size: 15px; opacity: 0.85">{{ link.label }}</a>
            </sc-for>
          </div>
        </sc-if>
      </sc-for>
      <a href="Каталог.dc.html" onMouseEnter="{{ close }}" onClick="{{ closeMobile }}" style="display: inline-flex; align-items: center; gap: 8px; background: #75070D; color: #F7EFE3; padding: 11px 20px; font-size: 14px; white-space: nowrap">Каталог →</a>
    </nav>
  </div>

  <sc-if value="{{ panel }}" hint-placeholder-val="{{ false }}">
    <div style="{{ panelStyle }}">
      <div style="max-width: 1280px; margin: 0 auto; padding: 34px 32px 38px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 36px">
        <sc-for list="{{ panel.cols }}" as="col" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 12px">
            <div style="font-family: 'IBM Plex Serif', Georgia, serif; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.6">{{ col.title }}</div>
            <sc-for list="{{ col.links }}" as="link" hint-placeholder-count="3">
              <a href="{{ link.href }}" style="{{ panel.linkStyle }}">{{ link.label }}</a>
            </sc-for>
          </div>
        </sc-for>
        <div style="{{ panel.noteStyle }}">{{ panel.note }}</div>
      </div>
    </div>
  </sc-if>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:420},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;about&quot;,&quot;brands&quot;,&quot;media&quot;,&quot;events&quot;,&quot;b2b&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const RED = '#75070D';

const MENU = [
  { key: 'about', label: 'О проекте', href: 'О проекте.dc.html', note: 'Кто мы и зачем платформа', cols: [
      { title: 'Проект', links: [
        { label: 'Миссия', href: 'О проекте.dc.html#mission' },
        { label: 'История', href: 'О проекте.dc.html#history' },
        { label: 'Пространство', href: 'О проекте.dc.html#space' } ] },
      { title: 'Как устроено', links: [
        { label: 'Платформа проекта', href: 'О проекте.dc.html#platform' },
        { label: 'Контакты', href: 'Контакты.dc.html' } ] } ] },
  { key: 'brands', label: 'Бренды', href: 'Каталог.dc.html', note: 'Марки Нижнего Новгорода', cols: [
      { title: 'Каталог', links: [
        { label: 'Все бренды', href: 'Каталог.dc.html#brands' },
        { label: 'Карта брендов', href: 'Каталог.dc.html#map' } ] },
      { title: 'Категории', links: [
        { label: 'Одежда', href: 'Каталог.dc.html#brands' },
        { label: 'Аксессуары', href: 'Каталог.dc.html#brands' },
        { label: 'Ремесло и керамика', href: 'Каталог.dc.html#brands' } ] } ] },
  { key: 'media', label: 'Медиа', href: 'Медиа.dc.html', note: 'Новости, лонгриды, съёмки', cols: [
      { title: 'Материалы', links: [
        { label: 'Новости', href: 'Медиа.dc.html#feed' },
        { label: 'Лонгриды', href: 'Медиа.dc.html#longreads' },
        { label: 'Видео', href: 'Медиа.dc.html#video' },
        { label: 'Фотопроекты', href: 'Медиа.dc.html#photo' } ] } ] },
  { key: 'events', label: 'Афиша', href: 'Афиша.dc.html', cols: [] },
  { key: 'forum', label: 'Форум', href: 'Форум.dc.html', dark: true, divider: true, note: 'Главное событие года для брендов и индустрии', cols: [
      { title: 'О форуме', links: [
        { label: 'О форуме', href: 'Форум.dc.html#about' },
        { label: 'Программа', href: 'Форум.dc.html#program' },
        { label: 'Спикеры', href: 'Форум.dc.html#speakers' } ] },
      { title: 'Участие', links: [
        { label: 'Регистрация на форум', href: 'Регистрация на форум.dc.html' },
        { label: 'Стать партнёром', href: 'О проекте.dc.html#partners' },
        { label: 'Архив форумов', href: 'Форум.dc.html#archive' } ] } ] },
  { key: 'b2b', label: 'Брендам', href: 'Каталог.dc.html#add', dark: true, note: 'Всё, что нужно марке, институции и рекламодателю', cols: [
      { title: 'Попасть на платформу', links: [
        { label: 'Добавить бренд', href: 'Каталог.dc.html#add' },
        { label: 'Добавить событие', href: 'Афиша.dc.html#submit-event' },
        { label: 'Участие в форуме', href: 'Регистрация на форум.dc.html' } ] },
      { title: 'Партнёрам', links: [
        { label: 'Стать партнёром', href: 'О проекте.dc.html#partners' },
        { label: 'Потенциал проекта', href: 'О проекте.dc.html#potential' },
        { label: 'Медиакит и заявка', href: 'О проекте.dc.html#join' } ] },
      { title: 'Личный кабинет', links: [
        { label: 'Войти', href: 'Авторизация.dc.html' },
        { label: 'Зарегистрировать бренд', href: 'Авторизация.dc.html' },
        { label: 'Кабинет бренда', href: 'Кабинет бренда.dc.html' } ] } ] }
];

class Component extends DCLogic {
  state = { open: null, mobileMenu: false, isMobile: false };
  headerRef = React.createRef();

  onScroll = () => {
    const el = this.headerRef.current;
    if (!el) return;
    const y = window.scrollY || 0;
    const h = el.offsetHeight || 74;
    const down = y > this.lastY;
    const hide = down && y > h * 1.5 && !this.state.mobileMenu && !this.state.open;
    el.style.transform = hide ? 'translateY(-' + (h + 8) + 'px)' : 'translateY(0)';
    if (hide && this.state.open) this.setState({ open: null });
    this.lastY = y;
  };

  componentDidMount() {
    this.lastY = window.scrollY || 0;
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.mq = window.matchMedia('(max-width: 1180px)');
    this.sync = () => this.setState({ isMobile: this.mq.matches, open: null, mobileMenu: false });
    this.mq.addEventListener('change', this.sync);
    this.setState({ isMobile: this.mq.matches });
  }
  componentWillUnmount() {
    if (this.mq) this.mq.removeEventListener('change', this.sync);
    window.removeEventListener('scroll', this.onScroll);
  }

  renderVals() {
    const { open, isMobile, mobileMenu } = this.state;
    const active = this.props.active;
    const cur = MENU.find(m => m.key === open && m.cols.length);

    const navStyle = isMobile
      ? (mobileMenu
        ? 'display: flex; flex-direction: column; align-items: flex-start; gap: 16px; width: 100%; padding: 18px 0 12px; font-size: 17px; max-height: calc(100vh - 110px); overflow-y: auto'
        : 'display: none')
      : 'display: flex; align-items: center; gap: 22px; font-size: 15px; flex-wrap: wrap; justify-content: flex-end; min-width: 0';

    return {
      headerRef: this.headerRef,
      isMobile,
      navStyle,
      toggleMobile: () => this.setState(s => ({ mobileMenu: !s.mobileMenu, open: null })),
      closeMobile: () => this.setState({ mobileMenu: false, open: null }),
      close: () => this.setState({ open: null }),
      items: MENU.map(m => {
        const on = open === m.key || active === m.key;
        const base = 'padding-bottom: 3px; white-space: nowrap; border-bottom: 1px solid ' + (on ? RED : 'transparent');
        return {
          ...m,
          mobileOpen: isMobile && open === m.key && m.cols.length > 0,
          allLinks: m.cols.reduce((a, c) => a.concat(c.links), []),
          onEnter: () => { if (!isMobile) this.setState({ open: m.cols.length ? m.key : null }); },
          onClick: (isMobile && m.cols.length)
            ? (e) => { e.preventDefault(); this.setState(s => ({ open: s.open === m.key ? null : m.key })); }
            : () => this.setState({ mobileMenu: false, open: null }),
          style: m.dark && !isMobile
            ? base + '; color: ' + RED + '; font-weight: 500' + (m.divider ? '; padding-left: 14px; margin-left: 2px; border-left: 1px solid rgba(117,7,13,0.3)' : '')
            : base
        };
      }),
      panel: (!isMobile && cur) ? {
        cols: cur.cols,
        note: cur.note,
        linkStyle: 'font-size: 16px; line-height: 1.4; color: ' + (cur.dark ? '#F3E7D8' : RED),
        noteStyle: "font-family: 'Yeseva One', serif; font-size: 19px; line-height: 1.35; max-width: 22ch; opacity: 0.8; color: " + (cur.dark ? '#F3E7D8' : RED)
      } : null,
      panelStyle: 'position: absolute; left: 0; right: 0; top: 100%; z-index: 2; border-bottom: 1px solid rgba(117,7,13,0.3); box-shadow: 0 22px 44px rgba(43,18,20,0.16); background: ' +
        (cur && cur.dark ? '#5B0207' : '#F7EFE3') + '; color: ' + (cur && cur.dark ? '#F3E7D8' : '#2B1214')
    };
  }
}

</script>
</body>
</html>
